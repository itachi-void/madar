<main id="mdr-main" class="wp-block-group has-global-padding is-layout-constrained wp-block-group-is-layout-constrained" style="margin-top:var(--wp--preset--spacing--60)">
	
	<div class="wp-block-group alignfull has-global-padding is-layout-constrained wp-block-group-is-layout-constrained" style="padding-top:var(--wp--preset--spacing--60);padding-bottom:var(--wp--preset--spacing--60)">
		
		<h1 class="wp-block-post-title">حسابي</h1>
		<div class="entry-content alignfull wp-block-post-content has-global-padding is-layout-constrained wp-block-post-content-is-layout-constrained"><div class="woocommerce"><h2>حسابك في مدار</h2><p>سجّل الدخول لمتابعة طلباتك وإدارة عناوينك وبيانات حسابك.</p><div class="woocommerce-notices-wrapper"></div>

<div class="u-columns col2-set" id="customer_login">

	<div class="u-column1 col-1">


		<h2>تسجيل الدخول</h2>

		<form class="woocommerce-form woocommerce-form-login login" novalidate="" data-mdr-preview-form="">

			
			<p class="woocommerce-form-row woocommerce-form-row--wide form-row form-row-wide">
				<label for="username">اسم المستخدم أو البريد الإلكتروني&nbsp;<span class="required" aria-hidden="true">*</span><span class="screen-reader-text">مطلوبة</span></label>
				<input type="text" class="woocommerce-Input woocommerce-Input--text input-text" name="username" id="username" autocomplete="username" value="" required="" aria-required="true">			</p>
			<p class="woocommerce-form-row woocommerce-form-row--wide form-row form-row-wide">
				<label for="password">كلمة المرور&nbsp;<span class="required" aria-hidden="true">*</span><span class="screen-reader-text">مطلوبة</span></label>
				<input class="woocommerce-Input woocommerce-Input--text input-text" type="password" name="password" id="password" autocomplete="current-password" required="" aria-required="true">
			</p>

			
			<p class="form-row">
				<label class="woocommerce-form__label woocommerce-form__label-for-checkbox woocommerce-form-login__rememberme">
					<input class="woocommerce-form__input woocommerce-form__input-checkbox" name="rememberme" type="checkbox" id="rememberme" value="forever"> <span>تذكرني</span>
				</label>
								<button type="submit" class="woocommerce-button button woocommerce-form-login__submit wp-element-button" name="login" value="تسجيل الدخول">تسجيل الدخول</button>
			</p>
			<p class="woocommerce-LostPassword lost_password">
				<a href="/my-account/lost-password/">نسيت كلمة مرورك؟</a>
			</p>

			
		</form>


	</div>

	<div class="u-column2 col-2">

		<h2>تسجيل جديد</h2>

		<form class="woocommerce-form woocommerce-form-register register" data-mdr-preview-form="">

			
			
			<p class="woocommerce-form-row woocommerce-form-row--wide form-row form-row-wide">
				<label for="reg_email">البريد الإلكتروني&nbsp;<span class="required" aria-hidden="true">*</span><span class="screen-reader-text">مطلوبة</span></label>
				<input type="email" class="woocommerce-Input woocommerce-Input--text input-text" name="email" id="reg_email" autocomplete="email" required="" aria-required="true">			</p>

			
				<p class="woocommerce-form-row woocommerce-form-row--wide form-row form-row-wide">
					<label for="reg_password">كلمة المرور&nbsp;<span class="required" aria-hidden="true">*</span><span class="screen-reader-text">مطلوبة</span></label>
					<input type="password" class="woocommerce-Input woocommerce-Input--text input-text" name="password" id="reg_password" autocomplete="new-password" required="" aria-required="true">
				</p>

			
			<wc-order-attribution-inputs></wc-order-attribution-inputs><div class="woocommerce-privacy-policy-text"><p>Your personal data will be used to support your experience throughout this website, to manage access to your account, and for other purposes described in our <a href="/?page_id=3" class="woocommerce-privacy-policy-link" target="_blank">سياسة الخصوصية</a>.</p>
</div>
			<p class="woocommerce-form-row form-row">
								<button type="submit" class="woocommerce-Button woocommerce-button button wp-element-button woocommerce-form-register__submit" name="register" value="تسجيل جديد">تسجيل جديد</button>
			</p>

			
		</form>

	</div>

</div>

</div>
</div>
	</div>
